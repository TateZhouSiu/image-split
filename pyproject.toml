[project]
name = "image-split"
version = "0.1.0"
description = "Split flat slide images into editable-ready transparent visual assets and region schemas."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "pillow>=10.0",
  "opencv-python>=4.8",
]

[project.optional-dependencies]
ocr = [
  "pytesseract>=0.3.10",
]
paddleocr = [
  "paddleocr[all]>=3.0",
]

[tool.ruff]
line-length = 120
